onboarding = false

[keys]
prefix = "ctrl+a"
split_vertical = "prefix+s"
split_horizontal = "prefix+v"
# workspaces
previous_workspace = "prefix+k"
next_workspace = "prefix+j"
# agents
next_agent = "prefix+n"
previous_agent = "prefix+p"
detach = "prefix+d"
close_pane = "prefix+q"
open_notification_target = "prefix+o"
remove_worktree = "prefix+-"
open_worktree = "prefix+shift+o"
goto = "prefix+g"
workspace_picker = "ctrl+w"
# tabs
switch_tab = "prefix+1..9"
close_tab = "prefix+x"
next_tab = "ctrl+t"

[theme]
name = "terminal"
auto_switch = false
custom.accent = "#e3a138"
custom.surface0 = "#575547"

[ui.toast]
delivery = "terminal"
delay_seconds = 5

[ui]
show_agent_labels_on_pane_borders = false
pane_gaps = false
pane_borders = false
hide_tab_bar_when_single_tab = true
accent = "#e3a138"
prompt_new_tab_name = false

[ui.sidebar.spaces]
row_gap = 1

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "jt.command-palette.open"
description = "Command palette"

[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"   # <plugin_id>.<action_id> — note the id, not the name

[[keys.command]]
key = "prefix+b"
type = "popup"
command = "tmux a"
description = "scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "tab-smart-rename.rename-now"
description = "smart rename current tab"
